name: Publish Inventory Count v1.6.3 Windows ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-inventory-count-v1.6.3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    name: Build, verify, and publish portable Windows package
    runs-on: windows-latest
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4

      - name: Copy application source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "projects/inventory-count-web-app/v1.6.3/source"
          $app = Join-Path $env:RUNNER_TEMP "inventory-release/Inventory_Count_Web_App"
          Write-Host "Source: $source"
          if (!(Test-Path -LiteralPath $source)) { throw "Inventory source directory missing." }
          New-Item -ItemType Directory -Path $app -Force | Out-Null
          Copy-Item -Path (Join-Path $source "*") -Destination $app -Recurse -Force
          if (!(Test-Path -LiteralPath (Join-Path $app "server.py"))) { throw "server.py did not copy." }

      - name: Download and verify official Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = Join-Path $env:RUNNER_TEMP "inventory-release"
          $download = Join-Path $base "python-3.14.7-embed-amd64.zip"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.14.7/python-3.14.7-embed-amd64.zip" -OutFile $download
          $sha = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "d297e5ff019966817ad8502465176139f2d3d840fa4ed84b13bed399a6ab1f15"
          Write-Host "Official runtime SHA-256: $sha"
          if ($sha -ne $expected) { throw "Official Python runtime checksum verification failed." }
          Expand-Archive -LiteralPath $download -DestinationPath (Join-Path $base "Inventory_Count_Web_App/runtime")
          if (!(Test-Path -LiteralPath (Join-Path $base "Inventory_Count_Web_App/runtime/python.exe"))) { throw "Missing embedded python.exe." }

      - name: Configure Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $env:RUNNER_TEMP "inventory-release/Inventory_Count_Web_App/runtime"
          @("python314.zip", ".", "..", "", "# Portable runtime; no third-party libraries.") | Set-Content -LiteralPath (Join-Path $runtime "python314._pth") -Encoding ascii
          @("Inventory Count Web App - Bundled Runtime", "Official CPython 3.14.7 Windows x64 embeddable package.", "Keep the runtime folder beside start_app.cmd.", "https://www.python.org/downloads/release/python-3147/") | Set-Content -LiteralPath (Join-Path $runtime "README.txt") -Encoding ascii
          & (Join-Path $runtime "python.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled runtime did not launch." }

      - name: Check application and stdlib imports
        shell: pwsh
        run: |
          $python = Join-Path $env:RUNNER_TEMP "inventory-release/Inventory_Count_Web_App/runtime/python.exe"
          & $python -c "import unittest, sqlite3, urllib, tempfile; print('stdlib imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "Stdlib imports failed." }
          & $python -c "import inventory_app, inventory_app.xlsxio, server; print('App imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "Application imports failed." }

      - name: Run inventory regression tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $app = Join-Path $env:RUNNER_TEMP "inventory-release/Inventory_Count_Web_App"
          $python = Join-Path $app "runtime/python.exe"
          $output = & $python -m unittest discover -s (Join-Path $app "tests") -p "test_*.py" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) {
            $diagnostic = "Windows embedded runtime unittest output (latest workflow run):" + [Environment]::NewLine + $output
            if ($diagnostic.Length -gt 12000) { $diagnostic = $diagnostic.Substring($diagnostic.Length - 12000) }
            $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($diagnostic))
            gh api -X PUT "repos/$env:GITHUB_REPOSITORY/contents/projects/inventory-count-web-app/v1.6.3/windows-test-diagnostic.txt" -f message="Record Windows inventory test diagnostic" -f content="$encoded" | Out-Null
            throw "Windows inventory regression tests failed."
          }

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $app = Join-Path $env:RUNNER_TEMP "inventory-release/Inventory_Count_Web_App"
          $zip = Join-Path $env:GITHUB_WORKSPACE "Inventory_Count_Web_App_v1.6.3_Expected_Units.zip"
          Compress-Archive -LiteralPath $app -DestinationPath $zip -CompressionLevel Optimal -Force
          if (!(Test-Path -LiteralPath $zip)) { throw "The portable ZIP was not created." }
          Add-Content -Path $env:GITHUB_ENV -Value "RELEASE_ZIP=$zip"
          $packageSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$packageSha  Inventory_Count_Web_App_v1.6.3_Expected_Units.zip" -Encoding ascii

      - name: Publish GitHub release and portable ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "inventory-count-v1.6.3"
          $asset = $env:RELEASE_ZIP
          $checksum = "$asset.sha256"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $checksum --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Inventory Count Web App v1.6.3 - Expected Units" --notes "Portable Windows 10/11 x64 inventory counting app. Extract the ZIP and double-click start_app.cmd. Includes the official Python 3.14.7 embedded runtime, so installing Python is not necessary. Includes Expected Units, Current Count, live Difference, Excel import/organization, and count review. No inventory database or credentials are included."
          }
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY
