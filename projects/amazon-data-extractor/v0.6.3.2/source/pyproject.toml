[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-data-extractor"
version = "0.6.3.2"
description = "Local Bright Data extraction and offline Amazon bullet comparison"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
  "openpyxl>=3.1,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
