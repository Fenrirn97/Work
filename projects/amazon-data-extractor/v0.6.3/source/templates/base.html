<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Amazon Data Extractor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">CATALOG QUALITY TOOL</p>
      <a class="brand" href="{{ url_for('index') }}">Amazon Data Extractor</a>
      <span class="version">v{{ version }}</span>
    </div>
    <form method="post" action="{{ url_for('exit_program') }}" data-exit-form>
      <button class="button button-danger" type="submit">Exit Program</button>
    </form>
  </header>

  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack" aria-live="polite">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
